[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual-disembodiment"
version = "0.1.0"
description = "Portable methods for brain-body forecasting and condition-matched EEG readout"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
dynamics = ["torch>=2.4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
